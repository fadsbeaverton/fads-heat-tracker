<style>

#past:not(:empty){margin-bottom:8px}

.wrap:has(#banner:not(.hidden)) .signin{margin-top:6vh}

.ev.now{font-weight:700}
body{background:transparent!important}body::before{content:"";position:fixed;top:calc(var(--wmTop,0px) + 16px);bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;margin:0 auto;width:min(86vw,520px);z-index:-1;pointer-events:none;background:url(/logo-bg.png) center/contain no-repeat;opacity:.1}

</style></head><body><div class="wrap">
<div class="top" id="top"><span>Practice data</span><span><i class="dot" id="dot"></i><span id="liveTxt">Connecting</span></span></div>
<div id="banner" class="annstack hidden" role="status"></div>

<div id="signin" class="signin hidden">
  <h1>My Heats</h1><p>Enter the personal code your studio sent you.</p>
  <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="6-character code">
  <button class="go" id="go">See my heats</button><div class="err" id="err"></div>
  <button class="link" id="schedFromSignin">Schedule</button>
</div>

<div id="main" class="hidden">
  <div class="floor"><div class="fl1"><small>Now on the floor</small><span class="d" id="nowDance"></span></div><b id="nowNum">Heat –</b></div>
  <div class="who"><b id="meName"></b><span class="links"><button class="link" id="showSched">Schedule</button><button class="link" id="out">Not you? Sign out</button></span></div>
  <div id="past"></div>
  <div id="next"></div>
  <h2 id="restH">Your upcoming heats</h2><div id="rest"></div>
</div>

<div id="sched" class="hidden">
  <button class="link" id="backSched">Back</button>
  <div id="schedList"></div>
</div>
</div>
<button type="button" id="recenter" class="recenter hidden">Back to my next heat</button>
<script src="/live.js"></script><script src="/dances.js"></script>
<script>
function abbr(d) { return window.Dances ? Dances.label(String(d || "").replace(/east coast swing/gi, "E.C. Swing")) : String(d || ""); }
// Privacy: this page never receives other dancers' heats. It gets only public live info
// (current heat, dance, level), this dancer's own heats from /api/me, and the public day schedule.
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mins = (k) => { const sec = (live && live.paceSec) || 105; const m = Math.max(1, Math.round(k * sec / 60)); return m >= 60 ? "about " + Math.floor(m / 60) + " hr " + (m % 60) + " min" : "about " + m + " min"; };
const away = (k) => k === 1 ? "1 heat away" : k + " heats away";
const schedCls = () => { const o = (live && live.scheduleOffsetMin) || 0; return Math.abs(o) <= 2 ? "ontime" : o > 0 ? "behind" : "ahead"; };
const sched = () => { const o = (live && live.scheduleOffsetMin) || 0; if (Math.abs(o) <= 2) return "On time"; const a = Math.abs(o), t = a >= 60 ? Math.floor(a / 60) + " hr " + (a % 60) + " min" : a + " min"; return o > 0 ? t + " behind" : t + " ahead"; };
let me = null, live = null, started = false, view = "home", events = [], awards = [], lastAnn = null, dataVer = null, focusKey = null, listSig = null, recRaf = 0;
async function loadProgram() {
  const d = await fetch("/api/data", { cache: "no-store" }).then((r) => r.json());
  events = d.events || []; awards = d.awards || [];
}
async function refreshMe() {
  const code = localStorage.getItem("simpleCode");
  if (!code) return;
  const r = await fetch("/api/me?code=" + encodeURIComponent(code), { cache: "no-store" }).catch(() => null);
  if (r && r.ok) { me = await r.json(); localStorage.setItem("simpleMe", JSON.stringify(me)); }
}
async function refreshProgram() {
  try { await loadProgram(); await refreshMe(); } catch (e) {}
  if (view === "sched") renderSched(); else render();
}
loadProgram().then(() => { if (view === "sched") renderSched(); else render(); }).catch(() => {});
const urlCode = new URLSearchParams(location.search).get("code");
if (urlCode) history.replaceState(null, "", "/competitor"); // keep the code out of the address bar / screenshots

async function signIn(code, fromForm) {
  code = String(code || "").trim().toUpperCase();
  if (!code) return show();
  const r = await fetch("/api/me?code=" + encodeURIComponent(code), { cache: "no-store" }).catch(() => null);
  if (!r || !r.ok) {
    if (r && r.status !== 404 && r.status !== 429 && !fromForm) { me = JSON.parse(localStorage.getItem("simpleMe") || "null"); return show(); } // offline: keep last copy
    localStorage.removeItem("simpleCode"); localStorage.removeItem("simpleMe"); me = null; show();
    $("#err").textContent = r && r.status === 429 ? "Too many tries. Wait a few minutes." : r ? "That code didn't work. Check the text from your studio." : "Can't reach the server.";
    return;
  }
  me = await r.json(); localStorage.setItem("simpleCode", code); localStorage.setItem("simpleMe", JSON.stringify(me)); show();
}
function show() {
  const onSched = view === "sched";
  $("#top").classList.toggle("hidden", onSched);
  $("#signin").classList.toggle("hidden", !!me || onSched);
  $("#main").classList.toggle("hidden", !me || onSched);
  $("#sched").classList.toggle("hidden", !onSched);
  if (onSched) {
    if (!started) { 
started = true; Live.start(); }
    hideRecenter();
    renderSched();
    return;
  }
  if (!me) { hideRecenter(); $("#code").focus(); return; }
  if (!started) { 
started = true; Live.start(); }
  render();
}
function awardRow(a) {
  const on = live && live.awards && live.awards.afterHeat === a.afterHeat;
  const at = a.time ? " · " + esc(String(a.time).replace(/\s*(AM|PM)$/i, (m, x) => x.toLowerCase())) : "";
  return `<div class="award${on ? " now" : ""}"><span>🏆 Awards - after Heat ${Number(a.afterHeat)}${at} 🏆</span></div>`;
}
// Multi-day comps: heats carry a day label ("Fri, Dec 4"); single-day comps have none and render exactly as before.
const sameDay = (h) => !h.day || !live || !live.now || !live.now.day || h.day === live.now.day;
let rowDay = null;
const dayHdr = (h) => { if (!h.day || h.day === rowDay) return ""; rowDay = h.day; return `<div class="dayh">${esc(h.day)}</div>`; };
function heatRow(h, past) {
  const t = h.time ? " - " + esc(String(h.time).replace(/\s*(AM|PM)$/i, (m, x) => x.toLowerCase())) : "";
  return `<div class="row${past ? " past" : ""}" data-n="${h.n}"><span>Heat ${h.n}${t}${h.dance ? " · " + esc(abbr(h.dance)) : ""}</span><span></span></div>`;
}
function stickyCut() {
  const floor = document.querySelector("#main .floor");
  const annH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--annH")) || 0;
  const topH = $("#top") ? $("#top").offsetHeight : 0;
  return (floor ? floor.offsetHeight : 0) + topH + annH + 12;
}
function cardInView() {
  const el = $("#card");
  if (!el) return false;
  const r = el.getBoundingClientRect();
  return r.bottom > stickyCut() - 2 && r.top < window.innerHeight - 16;
}
function hideRecenter() { const b = $("#recenter"); if (b) b.classList.add("hidden"); }
function syncRecenter() {
  const btn = $("#recenter");
  if (!btn) return;
  const onMain = !!(me && view !== "sched" && !$("#main").classList.contains("hidden"));
  btn.classList.toggle("hidden", !(onMain && $("#card") && !cardInView()));
}
function onScrollOrResize() {
  if (recRaf) return;
  recRaf = requestAnimationFrame(() => { recRaf = 0; syncRecenter(); });
}
// Scroll target for the next-heat card: include its day header (multi-day comps) so it isn't hidden under the sticky panel.
const withDayHdr = (el) => { const p = el && el.previousElementSibling; return p && p.classList.contains("dayh") ? p : el; };
function scrollToCard(smooth) {
  const el = withDayHdr($("#card"));
  if (!el) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const top = el.getBoundingClientRect().top + window.scrollY - stickyCut();
  window.scrollTo({ top: Math.max(0, top), behavior: (smooth && !reduce) ? "smooth" : "auto" });
}
function scrollToFocus(key) {
  if (key === focusKey) return;
  focusKey = key;
  const el = withDayHdr($("#card")) || (key === "done" ? $(".celebrate") : null);
  if (!el) { hideRecenter(); return; }
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const rect = el.getBoundingClientRect();
    const sticky = stickyCut();
    if (rect.top >= sticky - 2 && rect.bottom <= window.innerHeight - 16) { syncRecenter(); return; }
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: Math.max(0, rect.top + window.scrollY - sticky), behavior: reduce ? "auto" : "smooth" });

  }));
}
function listSignature(pastHeats, nx, restHeats, before, later) {
  const row = (h, p) => h.n + ":" + (p ? "p" : "u") + ":" + (h.dance || "") + ":" + (h.time || "") + ":" + (h.level || "");
  const aw = (a) => "a" + a.afterHeat;
  return [pastHeats.map((h) => row(h, 1)).join(), nx ? row(nx, 0) : "done", restHeats.map((h) => row(h, 0)).join(), before.map(aw).join(), later.map(aw).join()].join("/");
}
function updateCardInPlace(nx, cur) {
  const card = $("#card");
  if (!card) return;
  const k = nx.n - cur, cls = k === 0 ? "now" : k === 1 ? "next" : k <= 5 ? "deck" : "";
  const tag = k === 0 ? "Dancing now" : k === 1 ? "On deck" : k <= 5 ? "Dancing soon!" : "Your next heat";
  card.className = "card " + cls;
  const t = card.querySelector(".tag"); if (t) t.textContent = tag;
  const h = card.querySelector(".h"); if (h) h.textContent = "Heat " + nx.n;
  const d = card.querySelector(".d"); if (d) d.textContent = abbr(nx.dance) + (nx.level ? " · " + nx.level : "");
  const a = card.querySelector(".a"); if (a) a.textContent = k === 0 ? "On the floor now" : k === 1 ? "You're next!" : "";
  let badge = card.querySelector(".s");
  if (k > 0 && nx.time && sameDay(nx)) {
    if (!badge) { const bot = card.querySelector(".bot"); if (bot) bot.insertAdjacentHTML("beforeend", `<div class="s ${schedCls()}">${sched()}</div>`); }
    else { badge.className = "s " + schedCls(); badge.textContent = sched(); }
  } else if (badge) badge.remove();
}
function render() {
  if (!me || view === "sched") return;
  if (live) {
    const cur = live.currentHeat;
    const onAwards = !!live.awards;
    $("#nowNum").closest(".floor").classList.toggle("awards", onAwards);
    if (onAwards) {
      $("#nowNum").textContent = "🏆 Awards";
      $("#nowDance").textContent = "after Heat " + Number(live.awards.afterHeat);
    } else {
      $("#nowNum").textContent = "Heat " + cur;
      $("#nowDance").textContent = live.now && live.now.dance ? abbr(live.now.dance) : "";
    }
  }
  $("#meName").textContent = me.name;
  const cur = live ? live.currentHeat : 1;
  const pastHeats = me.heats.filter((h) => h.n < cur), up = me.heats.filter((h) => h.n >= cur), nx = up[0], restHeats = up.slice(1);
  const aw = awards.filter((a) => a.afterHeat >= cur);
  const before = aw.filter((a) => !nx || a.afterHeat < nx.n);
  const later = aw.filter((a) => nx && a.afterHeat >= nx.n);
  rowDay = null;
  const pastHtml = pastHeats.map((h) => dayHdr(h) + heatRow(h, true)).join("");
  // Awards always sit at the bottom of the list, after all of the dancer's heats, in time order.
  const awSorted = aw.slice().sort((a, b) => a.afterHeat - b.afterHeat);
  let nextHtml = "";
  if (nx) nextHtml += dayHdr(nx);
  if (!nx) nextHtml += `<div class="celebrate"><div class="cemoji">🎉</div><div class="ctitle">You're all done for today!</div><div class="csub">Great dancing 💃🕺</div></div>`;
  else {
    const k = nx.n - cur, cls = k === 0 ? "now" : k === 1 ? "next" : k <= 5 ? "deck" : "";
    const tag = k === 0 ? "Dancing now" : k === 1 ? "On deck" : k <= 5 ? "Dancing soon!" : "Your next heat";
    nextHtml += `<div class="card ${cls}" id="card"><div class="tag">${tag}</div><div class="h">Heat ${nx.n}</div><div class="d">${esc(abbr(nx.dance))}${nx.level ? " · " + esc(nx.level) : ""}</div><div class="bot"><div class="a">${k === 0 ? "On the floor now" : k === 1 ? "You're next!" : ""}</div>${k > 0 && nx.time && sameDay(nx) ? `<div class="s ${schedCls()}">${sched()}</div>` : ""}</div></div>`;

    $("#next").innerHTML = nextHtml;

      $("#restH").textContent = "Your heats today";
      $("#restH").classList.toggle("hidden", !pastHeats.length && !awSorted.length);
    } else {
      $("#past").innerHTML = pastHtml;
      for (const h of restHeats) restHtml += dayHdr(h) + heatRow(h, false);
      restHtml += awSorted.map(awardRow).join("");
      $("#restH").textContent = "Your upcoming heats";
      $("#restH").classList.toggle("hidden", !restHeats.length && !awSorted.length);
    }
    $("#rest").innerHTML = restHtml;
    listSig = sig;
    if (sameFocus) window.scrollTo(0, y);
  }
  scrollToFocus(focus);
  syncRecenter();
}
function evStatus(ev, i) {
  const cur = live ? live.currentHeat : 0;
  const nowMin = live && live.clockMin;
  const next = events[i + 1];
  if (live && live.awards) {
    const isLive = (e) => e.afterHeat != null ? Number(e.afterHeat) === Number(live.awards.afterHeat) : (e.title === "Awards" && e.time === live.awards.time);
    if (isLive(ev)) return "now";
    const ai = events.findIndex(isLive);
    if (ai >= 0) return i < ai ? "done" : "";
  }
  if (ev.from != null) {

      return "now";
