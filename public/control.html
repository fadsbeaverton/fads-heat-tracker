<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ballroom Control · Example Comp</title><meta name="theme-color" content="#0e1020">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css">
<style>.ctl .heat{grid-template-columns:52px 1fr auto;cursor:pointer}.ctl .heat.cur{border-color:var(--ok);background:rgba(61,220,151,.14)}
.gate{margin-top:30vh;text-align:center}.gate input{text-align:center;font-size:28px;letter-spacing:10px;max-width:220px;margin:12px auto;display:block}
.err{color:var(--bad);min-height:20px}.mini{font-size:13px;color:var(--mut);margin:10px 0}.sticky{position:sticky;top:64px;z-index:4;background:var(--bg);padding-bottom:8px}</style>
</head><body><div class="wrap">
<header class="top"><div class="brand"><div class="logo">🎛️</div><div><h1>Ballroom Control</h1><small id="compName">Staff only</small></div>
<div class="badges"><span class="ex">Example data</span><div class="live re" id="live"><i class="dot"></i><span>Connecting…</span></div></div></div></header>

<div id="gate" class="gate"><div style="font-size:15px;color:var(--mut)">Enter staff PIN</div><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button class="btn pri" id="go" style="width:220px">Unlock</button><div class="err" id="err"></div></div>

<div id="app" class="hidden">
  <div class="sticky">
  <section class="now" id="now"><div class="lbl">Now on the floor</div><div class="big" id="nowNum"></div><div class="sub" id="nowDesc"></div><div class="next" id="nowNext"></div></section>
  <div class="row" style="margin-top:10px"><button class="btn" id="prev">◀ Previous</button><button class="btn pri" id="next" style="flex:2">Next heat ▶</button></div>
  </div>
  <div class="row" style="margin-top:4px"><input id="jump" type="number" inputmode="numeric" placeholder="Jump to heat #"><button class="btn" id="jumpGo" style="flex:0 0 90px;padding:12px">Go</button></div>
  <div class="row" style="margin-top:8px"><input id="annIn" placeholder="Announcement to all phones (optional)" maxlength="200"><button class="btn" id="annGo" style="flex:0 0 90px;padding:12px">Post</button></div>
  <div class="mini" id="meta"></div>
  <details class="card" id="codes" style="margin:6px 0 12px"><summary style="font-weight:700;cursor:pointer">🔑 Student access codes &amp; links (staff only)</summary>
    <div class="mini">Text each student their own link. Codes are private: a student only sees their own heats. Example data.</div><div id="codeList"></div></details>
  <div class="ctl" id="list"></div>
</div></div>
<script src="/live.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let D, cur = 1, pin = sessionStorage.getItem("pin") || "";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function send(body) {
  const r = await fetch("/api/control", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { sessionStorage.removeItem("pin"); location.reload(); }
  if (!r.ok) alert(j.error || "Failed"); return r.ok;
}
async function unlock() {
  pin = $("#pin").value || pin;
  const r = await fetch("/api/control", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin, action: "check" }) });
  if (!r.ok) { $("#err").textContent = "Wrong PIN"; return; }
  sessionStorage.setItem("pin", pin); $("#gate").classList.add("hidden"); $("#app").classList.remove("hidden");
  if (!D) boot();
}
$("#go").onclick = unlock; $("#pin").onkeydown = (e) => { if (e.key === "Enter") unlock(); };
$("#next").onclick = () => send({ action: "next" }); $("#prev").onclick = () => send({ action: "prev" });
$("#jumpGo").onclick = () => { const v = $("#jump").value; if (v) send({ heat: v }).then((ok) => ok && ($("#jump").value = "")); };
$("#annGo").onclick = () => send({ announcement: $("#annIn").value });
function stu(id) { return D.students.find((s) => s.id === id).name; } function pro(id) { return D.pros.find((p) => p.id === id).name; }
function render(st) {
  const onAwards = st && st.awards;
  const h = D.heats[cur - 1], nx = onAwards ? D.heats[st.awards.afterHeat] : D.heats[cur];
  if (onAwards) {
    $("#nowNum").innerHTML = `🏆 Awards`;
    $("#nowDesc").textContent = `after Heat ${st.awards.afterHeat}` + (st.awards.time ? ` · ${st.awards.time}` : "");
    $("#nowNext").textContent = nx ? `Next: Heat ${nx.n} — ${nx.style} ${nx.dance}` : "Final awards";
  } else {
    $("#nowNum").innerHTML = `Heat ${cur} <span>of ${D.heats.length}</span>`;
    $("#nowDesc").innerHTML = `<span class="pill ${h.style}">${h.style}</span> ${esc(h.dance)} · ${esc(h.level)} · sched. ${h.time}`;
    $("#nowNext").textContent = nx ? `Next: Heat ${nx.n} — ${nx.style} ${nx.dance}` : "Final heat";
  }
  if (st) $("#meta").textContent = `${st.viewers || 0} device(s) connected · last change ${new Date(st.updatedAt).toLocaleTimeString()}` + (st.announcement ? ` · Announcement: “${st.announcement}”` : "");
  $("#list").innerHTML = D.heats.map((x) => `<div class="heat ${!onAwards && x.n === cur ? "cur" : x.n < cur || (onAwards && x.n === cur) ? "done" : ""}" data-n="${x.n}"><div class="num">${x.n}</div>
    <div class="d"><b><span class="pill ${x.style}">${x.style}</span>${esc(x.dance)} · ${esc(x.level)}</b><small>${x.time} · ${x.entries.map((e) => `#${e.couple} ${esc(stu(e.studentId))}/${esc(pro(e.proId))}`).join(", ") || "Open heat"}</small></div>
    <div class="st">${!onAwards && x.n === cur ? '<span class="tag dancing">ON FLOOR</span>' : "Set"}</div></div>`).join("");
  if (st && !window._scrolled && !$("#app").classList.contains("hidden")) { window._scrolled = 1; const c = $("#list .cur"); c && c.scrollIntoView({ block: "center" }); }
  $("#list").querySelectorAll(".heat").forEach((el) => el.onclick = () => { const n = +el.dataset.n; if (n !== cur && confirm(`Set floor to Heat ${n}?`)) send({ heat: n }); });
}
// Full heat list (with entries + student codes) is only sent with the staff PIN, so load it after unlocking.
function boot() { fetch("/api/data", { headers: { "X-Staff-Pin": pin } }).then((r) => r.json()).then((d) => {
  D = d; $("#compName").textContent = d.comp.name + " · Staff";
  renderCodes();
  let dataVer = null;
  Live.onStatus((s) => setLiveBadge($("#live"), s));
  Live.onState((st) => {
    cur = st.currentHeat; $("#annIn").value = $("#annIn").value || st.announcement || "";
    if (dataVer != null && st.dataVersion != null && st.dataVersion !== dataVer) {
      fetch("/api/data", { headers: { "X-Staff-Pin": pin }, cache: "no-store" }).then((r) => r.json()).then((d) => { D = d; renderCodes(); render(st); });
    } else render(st);
    dataVer = st.dataVersion;
  });
  render(); Live.start();
}); }
function renderCodes() {
  const base = location.origin + "/simple?code=";
  $("#codeList").innerHTML = D.students.map((s) => `<div class="heat" style="grid-template-columns:1fr auto;cursor:default"><div class="d"><b>${esc(s.name)}</b><small>${base}${s.code}</small></div><div class="st"><b style="font-family:monospace;font-size:16px;letter-spacing:1px">${s.code}</b></div></div>`).join("");
}
if (pin) unlock();
</script></body></html>
